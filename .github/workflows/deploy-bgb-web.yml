name: Deploy BoardgameBuddy Web

# BoardgameBuddy is isolated under projects/boardgame-buddy/ and deploys to
# Cloudflare Pages, not Vercel. deploy-frontend.yml filters this project out of
# its change detection, so this is the only workflow that ships the web app.
on:
  push:
    branches: [main]
    paths:
      - projects/boardgame-buddy/web/**
      - projects/boardgame-buddy/scripts/**
      - .github/workflows/deploy-bgb-web.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/boardgame-buddy
    steps:
      - uses: actions/checkout@v4

      # config.js is gitignored and generated per environment. API_BASE is a
      # repo VARIABLE so the backend can be re-pointed (shared Railway service
      # -> BGB's own -> Hetzner) without editing this file.
      - name: Generate config.js
        working-directory: ./projects/boardgame-buddy/web
        env:
          API_BASE: ${{ vars.BGB_API_BASE }}
          SUPABASE_URL: ${{ secrets.VIBELAB_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VIBELAB_SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ vars.BGB_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.BGB_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.BGB_FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.BGB_FIREBASE_APP_ID }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Repo variable BGB_API_BASE is unset. Set it to the"
            echo "::error::BoardgameBuddy API origin (no trailing slash) under"
            echo "::error::Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          # Firebase is a WARNING, not an error: the app still signs in through
          # the Supabase Auth SDK until Stage 3-ALT.4, so an unset variable here
          # is the expected state before the auth swap. A PARTIAL set is the
          # real hazard -- three of four values present looks configured and
          # fails at sign-in -- so complain about that specifically.
          fb_set=0; fb_unset=0
          for v in "$FIREBASE_API_KEY" "$FIREBASE_AUTH_DOMAIN" \
                   "$FIREBASE_PROJECT_ID" "$FIREBASE_APP_ID"; do
            if [ -n "$v" ]; then fb_set=$((fb_set + 1)); else fb_unset=$((fb_unset + 1)); fi
          done
          if [ "$fb_set" -gt 0 ] && [ "$fb_unset" -gt 0 ]; then
            echo "::error::BGB_FIREBASE_* is partially set ($fb_set of 4). Set all"
            echo "::error::four (API_KEY, AUTH_DOMAIN, PROJECT_ID, APP_ID) or none."
            exit 1
          fi
          if [ "$fb_set" -eq 0 ]; then
            echo "::warning::BGB_FIREBASE_* unset - config.js ships without"
            echo "::warning::Firebase Auth. Expected until Stage 3-ALT.4."
          fi
          bash build.sh

      # Deploy-artifact-only Tailwind precompile. The checked-in index.html
      # keeps the DaisyUI/Tailwind CDN pair because the runtime JIT must run
      # before first paint in local dev; this builds a minified static sheet and
      # swaps the CDN block for it in the checkout being uploaded. Nothing is
      # committed back.
      - name: Precompile Tailwind + DaisyUI
        working-directory: ./projects/boardgame-buddy/web
        run: |
          # tailwind.config.js's require("daisyui") must resolve, so install
          # both packages into a scratch dir OUTSIDE web/ — a node_modules here
          # would ship to Pages with the static site.
          SCRATCH=$(mktemp -d)
          npm install --prefix "$SCRATCH" --no-audit --no-fund tailwindcss@3 daisyui@4
          cat > tailwind.config.js << 'TWCONFIG'
          module.exports = {
            content: ["./**/*.{html,js}"],
            plugins: [require("daisyui")],
            // index.html pins data-theme="luxury"; no other themes are used.
            daisyui: { themes: ["luxury"] },
          };
          TWCONFIG
          # The @tailwind directives are REQUIRED: without -i the CLI emits
          # utilities only — no DaisyUI component classes and no theme vars.
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tailwind.input.css
          NODE_PATH="$SCRATCH/node_modules" "$SCRATCH/node_modules/.bin/tailwindcss" \
            -c tailwind.config.js -i tailwind.input.css -o assets/bgb-tw.css --minify
          # Sanity gate: fail the deploy if the DaisyUI layer is missing.
          grep -q ".btn-primary" assets/bgb-tw.css || { echo "bgb-tw.css missing DaisyUI components"; exit 1; }
          rm tailwind.config.js tailwind.input.css
          # Swap the CDN <link> + <script> pair for the precompiled sheet.
          # Anchored on the CDN URLs; fails loudly if index.html drifted.
          node << 'SWAP'
          const fs = require("fs");
          let html = fs.readFileSync("index.html", "utf8");
          const linkRe = /<link[^>]*href="https:\/\/cdn\.jsdelivr\.net\/npm\/daisyui[^"]*"[^>]*\/?>/;
          const scriptRe = /[ \t]*<script src="https:\/\/cdn\.tailwindcss\.com"><\/script>\n?/;
          if (!linkRe.test(html) || !scriptRe.test(html)) {
            console.error("DaisyUI/Tailwind CDN block not found in index.html — aborting swap");
            process.exit(1);
          }
          html = html.replace(linkRe, '<link rel="stylesheet" href="assets/bgb-tw.css" />');
          html = html.replace(scriptRe, "");
          fs.writeFileSync("index.html", html);
          console.log("index.html now uses precompiled assets/bgb-tw.css");
          SWAP

      # Runs AFTER Tailwind (so it sees the CDN-swapped shell) and BEFORE the
      # sw.js stamp (so the worker's precache sweep reads the final shell).
      # That order is load-bearing — see the script's own header.
      - name: Bundle + minify JS/CSS
        run: node scripts/bgb-bundle.mjs web

      # STABLE URLS ARE THE ONE THING sw.js CANNOT REFRESH.
      #
      # Its fetch handler serves every same-origin subresource cacheFirst with
      # revalidation OFF, on the argument that the cache is keyed by build id
      # so a hit is by construction this build's file. That holds only while
      # the ACTIVE WORKER is this build's worker — and an iOS standalone PWA
      # can keep an old one for a long time. Navigations are network-first, so
      # the shell and the content-hashed bundle stay current either way; what
      # freezes is every file whose url never changes. The tour's scene modules
      # sat three releases stale on a device whose bullets, in the same bundle,
      # were current.
      #
      # Stamping the url is the only fix that does not depend on the worker
      # updating: the shell is fetched fresh, so it names a url no cache has
      # ever held, and a miss goes to the network. Two sets need it — the
      # lazily-loaded modules behind rel=prefetch (ui/lazy-script.js resolves a
      # bare path through these links, so the stamp reaches the loader with no
      # call site knowing about it), and assets/bgb-tw.css, which the Tailwind
      # step above rewrites every deploy at a stable name while _headers pins
      # /assets/* immutable for a year.
      #
      # AFTER the bundle step, which rewrites index.html; before the upload.
      # sw.js's own precache sweep reads src=/href= off the final shell, so it
      # picks up the stamped urls with no change of its own.
      - name: Stamp cache-busting version on stable-url assets
        working-directory: ./projects/boardgame-buddy/web
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          node << 'STAMP'
          const fs = require("fs");
          const v = process.env.BUILD_SHA;
          let html = fs.readFileSync("index.html", "utf8");
          let n = 0;
          html = html.replace(
            /(<link rel="prefetch" href=")([^"?]+)(")/g,
            (_m, a, href, c) => { n++; return a + href + "?v=" + v + c; });
          let m = 0;
          html = html.replace(
            /(<link rel="stylesheet" href=")(assets\/bgb-tw\.css)(")/,
            (_x, a, href, c) => { m++; return a + href + "?v=" + v + c; });
          // Loud, not silent: a shell that drifted out from under either
          // pattern would go back to serving stale files forever, and the
          // whole failure mode is that nothing looks wrong.
          if (!n) { console.error("no rel=prefetch links found — aborting stamp"); process.exit(1); }
          if (!m) { console.error("assets/bgb-tw.css link not found — aborting stamp"); process.exit(1); }
          fs.writeFileSync("index.html", html);
          console.log(`stamped ?v=${v} on ${n} prefetch links and the Tailwind sheet`);
          STAMP

      # sw.js keys its cache on this id, so a fresh SHA per deploy means the new
      # build lands in a new cache and activate() deletes the old one. Left
      # literal in the repo, which sw.js reads as "local dev" and disables
      # itself — so the grep is a real guard, not a formality.
      - name: Stamp service-worker build id
        working-directory: ./projects/boardgame-buddy/web
        run: |
          grep -q "__BGB_BUILD_ID__" sw.js || { echo "sw.js build-id placeholder missing"; exit 1; }
          sed -i "s/__BGB_BUILD_ID__/${GITHUB_SHA}/" sw.js
          echo "sw.js cache stamped with ${GITHUB_SHA}"

      # Direct Upload, not the Pages Git integration: the three steps above
      # generate the artifact and Cloudflare's own build step cannot reproduce
      # them. --commit-dirty is required because those steps deliberately
      # modify the checkout.
      - name: Deploy to Cloudflare Pages
        working-directory: ./projects/boardgame-buddy/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy . \
            --project-name=bgbuddy \
            --branch=main \
            --commit-dirty=true
