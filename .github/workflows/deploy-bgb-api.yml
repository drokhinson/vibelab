name: Deploy BoardgameBuddy API

# The isolated API needs its OWN Railway service, with Root Directory set to
# projects/boardgame-buddy/api, alongside the existing service pointed at
# shared-backend. Railway's native GitHub integration auto-deploys on push;
# this job exists to run the tests that gate that deploy.
on:
  push:
    branches: [main]
    paths:
      - projects/boardgame-buddy/api/**
      - .github/workflows/deploy-bgb-api.yml
  pull_request:
    paths:
      - projects/boardgame-buddy/api/**
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/boardgame-buddy/api
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/boardgame-buddy/api/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt pytest

      - name: Test
        run: pytest tests/ -q

      - name: Import the app
        run: python -c "from main import app; assert app.openapi()['paths']"

      - name: Notify
        run: echo "Tests green. Railway auto-deploys projects/boardgame-buddy/api on push to main."
