name: Deploy BoardgameBuddy Web (Vercel bridge)

# TEMPORARY ESCAPE HATCH. Delete this file once Cloudflare Pages has served
# bgbuddy.app without incident for a week or two.
#
# Why it exists: merging the isolation branch removes boardgame-buddy from
# deploy-frontend.yml's change detection AND moves the bundler out of
# .github/scripts/, so main loses every path that could ship BGB to Vercel.
# If Pages then breaks, there is no way to push a fix to the old host. This
# workflow is that way.
#
# It is workflow_dispatch ONLY and must stay that way. A push trigger here
# would race deploy-bgb-web.yml, leaving two live frontends built from the same
# commit and no way to tell which one a given visitor got.
#
# The build steps below are duplicated from deploy-bgb-web.yml deliberately
# rather than factored into a composite action. A fallback that builds
# differently from production is a fallback you cannot trust, and this file is
# scheduled for deletion — the two are meant to be read side by side and
# thrown away together, not maintained as a shared abstraction.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/boardgame-buddy
    steps:
      - uses: actions/checkout@v4

      # Same generated config.js as the Pages deploy, BGB_API_BASE included.
      # Deliberately NOT the shared Railway origin that deploy-frontend.yml
      # hardcodes: the API has already moved to its own service, so a Vercel
      # fallback pointed at the old shared backend would serve a frontend
      # talking to a host that no longer owns BoardgameBuddy's routes.
      - name: Generate config.js
        working-directory: ./projects/boardgame-buddy/web
        env:
          API_BASE: ${{ vars.BGB_API_BASE }}
          SUPABASE_URL: ${{ secrets.VIBELAB_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VIBELAB_SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ vars.BGB_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.BGB_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.BGB_FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.BGB_FIREBASE_APP_ID }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Repo variable BGB_API_BASE is unset. Set it to the"
            echo "::error::BoardgameBuddy API origin (no trailing slash) under"
            echo "::error::Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          fb_set=0; fb_unset=0
          for v in "$FIREBASE_API_KEY" "$FIREBASE_AUTH_DOMAIN" \
                   "$FIREBASE_PROJECT_ID" "$FIREBASE_APP_ID"; do
            if [ -n "$v" ]; then fb_set=$((fb_set + 1)); else fb_unset=$((fb_unset + 1)); fi
          done
          if [ "$fb_set" -gt 0 ] && [ "$fb_unset" -gt 0 ]; then
            echo "::error::BGB_FIREBASE_* is partially set ($fb_set of 4). Set all"
            echo "::error::four (API_KEY, AUTH_DOMAIN, PROJECT_ID, APP_ID) or none."
            exit 1
          fi
          bash build.sh

      - name: Precompile Tailwind + DaisyUI
        working-directory: ./projects/boardgame-buddy/web
        run: |
          SCRATCH=$(mktemp -d)
          npm install --prefix "$SCRATCH" --no-audit --no-fund tailwindcss@3 daisyui@4
          cat > tailwind.config.js << 'TWCONFIG'
          module.exports = {
            content: ["./**/*.{html,js}"],
            plugins: [require("daisyui")],
            daisyui: { themes: ["luxury"] },
          };
          TWCONFIG
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tailwind.input.css
          NODE_PATH="$SCRATCH/node_modules" "$SCRATCH/node_modules/.bin/tailwindcss" \
            -c tailwind.config.js -i tailwind.input.css -o assets/bgb-tw.css --minify
          grep -q ".btn-primary" assets/bgb-tw.css || { echo "bgb-tw.css missing DaisyUI components"; exit 1; }
          rm tailwind.config.js tailwind.input.css
          node << 'SWAP'
          const fs = require("fs");
          let html = fs.readFileSync("index.html", "utf8");
          const linkRe = /<link[^>]*href="https:\/\/cdn\.jsdelivr\.net\/npm\/daisyui[^"]*"[^>]*\/?>/;
          const scriptRe = /[ \t]*<script src="https:\/\/cdn\.tailwindcss\.com"><\/script>\n?/;
          if (!linkRe.test(html) || !scriptRe.test(html)) {
            console.error("DaisyUI/Tailwind CDN block not found in index.html — aborting swap");
            process.exit(1);
          }
          html = html.replace(linkRe, '<link rel="stylesheet" href="assets/bgb-tw.css" />');
          html = html.replace(scriptRe, "");
          fs.writeFileSync("index.html", html);
          console.log("index.html now uses precompiled assets/bgb-tw.css");
          SWAP

      - name: Bundle + minify JS/CSS
        run: node scripts/bgb-bundle.mjs web

      - name: Stamp service-worker build id
        working-directory: ./projects/boardgame-buddy/web
        run: |
          grep -q "__BGB_BUILD_ID__" sw.js || { echo "sw.js build-id placeholder missing"; exit 1; }
          sed -i "s/__BGB_BUILD_ID__/${GITHUB_SHA}/" sw.js
          echo "sw.js cache stamped with ${GITHUB_SHA}"

      # vercel.json in the tree carries the SPA rewrite, so deep paths resolve
      # here without the _redirects file Pages needs. Both are checked in and
      # each host ignores the other's.
      - name: Deploy to Vercel
        working-directory: ./projects/boardgame-buddy/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BOARDGAME_BUDDY_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
