<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Buddy System badge — two Buddies sharing a table">
  <title>Buddy System badge — two Buddies sharing a table</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold. -->
  <defs>
    <linearGradient id="buddy-system-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C662"/>
      <stop offset="55%" stop-color="#E0A94A"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <radialGradient id="buddy-system-disc" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0%" stop-color="#3C2A1E"/>
      <stop offset="100%" stop-color="#160F0A"/>
    </radialGradient>
    <clipPath id="buddy-system-clip">
      <circle cx="80" cy="80" r="70"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#buddy-system-disc)"/>
  <g clip-path="url(#buddy-system-clip)">
    <path d="M8 126 H152" stroke="#8A5A32" stroke-width="5" stroke-linecap="round"/><rect x="8" y="126" width="144" height="34" fill="#6B4526" opacity="0.55"/><g transform="translate(10.00 35.60) scale(0.44)">
    <circle cx="100" cy="148" r="14" fill="url(#buddy-system-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#buddy-system-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#buddy-system-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M78 100 Q100 124 122 100" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g><g transform="translate(62.00 35.60) scale(0.44)">
    <circle cx="100" cy="148" r="14" fill="url(#buddy-system-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#buddy-system-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#buddy-system-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M78 100 Q100 124 122 100" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g><path d="M74 78 Q80 68 86 78" stroke="#F0C662" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M80 24 Q81.3 28.7 86 30 Q81.3 31.3 80 36 Q78.7 31.3 74 30 Q78.7 28.7 80 24 Z" fill="#F0C662" opacity="0.9"/>
  </g>
  <circle cx="80" cy="80" r="72.5" fill="none" stroke="#E0A94A" stroke-width="4"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#E0A94A" stroke-width="1.4" opacity="0.34"/>
