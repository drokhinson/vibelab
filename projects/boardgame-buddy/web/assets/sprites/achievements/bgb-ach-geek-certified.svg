    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#geek-certified-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M78 100 Q100 124 122 100" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g><path d="M112 96 L106 128 L120 120 L132 130 L128 96 Z" fill="#C8553D"/><circle cx="120" cy="88" r="20" fill="url(#geek-certified-gold)"/><circle cx="120" cy="88" r="14" fill="#F8F2E5"/><path d="M113 88 L118 94 L128 82" stroke="#1F6B2E" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 28 Q41.3 32.7 46 34 Q41.3 35.3 40 40 Q38.7 35.3 34 34 Q38.7 32.7 40 28 Z" fill="#F0C662" opacity="0.9"/>
