<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Against the Machine badge — Buddy facing down a cracked gear">
  <title>Against the Machine badge — Buddy facing down a cracked gear</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold. -->
  <defs>
    <linearGradient id="against-the-machine-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C662"/>
      <stop offset="55%" stop-color="#E0A94A"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <radialGradient id="against-the-machine-disc" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0%" stop-color="#3C2A1E"/>
      <stop offset="100%" stop-color="#160F0A"/>
    </radialGradient>
    <clipPath id="against-the-machine-clip">
      <circle cx="80" cy="80" r="70"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#against-the-machine-disc)"/>
  <g clip-path="url(#against-the-machine-clip)">
    <!-- The opponent in a co-op game is the box itself, so it is drawn as a
         machine rather than a second Buddy — and it is already cracked, because
         the badge is the win and not the fight. -->
    <g transform="translate(106 76)">
      <g fill="#8A5A32">
        <rect x="-5" y="-34" width="10" height="13" rx="2.5"/>
        <rect x="-5" y="-34" width="10" height="13" rx="2.5" transform="rotate(45)"/>
        <rect x="-5" y="-34" width="10" height="13" rx="2.5" transform="rotate(90)"/>
        <rect x="-5" y="-34" width="10" height="13" rx="2.5" transform="rotate(135)"/>
        <rect x="-5" y="-34" width="10" height="13" rx="2.5" transform="rotate(180)"/>
        <rect x="-5" y="-34" width="10" height="13" rx="2.5" transform="rotate(225)"/>
        <rect x="-5" y="-34" width="10" height="13" rx="2.5" transform="rotate(270)"/>
        <rect x="-5" y="-34" width="10" height="13" rx="2.5" transform="rotate(315)"/>
      </g>
      <circle r="24" fill="#5A3A20" stroke="#8A5A32" stroke-width="4"/>
      <circle r="8" fill="#160F0A"/>
      <path d="M-2 -24 L4 -9 L-6 -1 L3 11 L-1 24" fill="none" stroke="#F0C662" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(-9.50 38.00) scale(0.5)">
    <circle cx="100" cy="148" r="14" fill="url(#against-the-machine-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#against-the-machine-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#against-the-machine-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M78 100 Q100 124 122 100" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
    <path d="M70 76 Q71.4 81.1 76.5 82.5 Q71.4 83.9 70 89 Q68.6 83.9 63.5 82.5 Q68.6 81.1 70 76 Z" fill="#F0C662" opacity="0.9"/>
    <path d="M40 30 Q41.1 33.9 45 35 Q41.1 36.1 40 40 Q38.9 36.1 35 35 Q38.9 33.9 40 30 Z" fill="#F0C662" opacity="0.9"/>
  </g>
  <circle cx="80" cy="80" r="72.5" fill="none" stroke="#A9682F" stroke-width="4"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#A9682F" stroke-width="1.4" opacity="0.34"/>
</svg>
