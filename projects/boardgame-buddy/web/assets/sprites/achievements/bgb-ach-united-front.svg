<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="United Front badge — three Buddies in a row under one banner">
  <title>United Front badge — three Buddies in a row under one banner</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold. -->
  <defs>
    <linearGradient id="united-front-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C662"/>
      <stop offset="55%" stop-color="#E0A94A"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <radialGradient id="united-front-disc" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0%" stop-color="#3C2A1E"/>
      <stop offset="100%" stop-color="#160F0A"/>
    </radialGradient>
    <clipPath id="united-front-clip">
      <circle cx="80" cy="80" r="70"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#united-front-disc)"/>
  <g clip-path="url(#united-front-clip)">
    <!-- One banner over all three — Dream Team's shared bar, grown into the
         thing a side rallies under. -->
    <path d="M32 56 Q80 32 128 56 L128 66 Q80 42 32 66 Z" fill="url(#united-front-gold)"/>
    <path d="M32 56 L24 50 L26 62 L32 66 Z" fill="#C9922A"/>
    <path d="M128 56 L136 50 L134 62 L128 66 Z" fill="#C9922A"/>
    <!-- Three abreast, shoulder to shoulder, no gaps between them. -->
    <g transform="translate(10.85 60.00) scale(0.33)">
    <circle cx="100" cy="148" r="14" fill="url(#united-front-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#united-front-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#united-front-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M78 100 Q100 124 122 100" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
    <g transform="translate(46.85 60.00) scale(0.33)">
    <circle cx="100" cy="148" r="14" fill="url(#united-front-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#united-front-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#united-front-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M78 100 Q100 124 122 100" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
    <g transform="translate(82.85 60.00) scale(0.33)">
    <circle cx="100" cy="148" r="14" fill="url(#united-front-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#united-front-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#united-front-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M78 100 Q100 124 122 100" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
    <path d="M80 12 Q81.4 17.1 86.5 18.5 Q81.4 19.9 80 25 Q78.6 19.9 73.5 18.5 Q78.6 17.1 80 12 Z" fill="#F0C662" opacity="0.9"/>
  </g>
  <circle cx="80" cy="80" r="72.5" fill="none" stroke="#E0A94A" stroke-width="4"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#E0A94A" stroke-width="1.4" opacity="0.34"/>
</svg>
