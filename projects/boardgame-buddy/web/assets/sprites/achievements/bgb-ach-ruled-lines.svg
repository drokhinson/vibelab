<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ruled Lines badge — Buddy above a scorepad of colour-tabbed scoring rows">
  <title>Ruled Lines badge — Buddy above a scorepad of colour-tabbed scoring rows</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold; a standalone badge like this one is gold.
       The four row tabs are the real scoring-grid palette (green, gold, blue,
       red — the row colour custom properties in styles.css), drawn as the 3px
       inset rule plus its wash, so the pad reads as THE scoring grid rather
       than as any notepad. An XML comment cannot contain a double hyphen, so
       the token names are spelled out here rather than quoted. -->
  <defs>
    <linearGradient id="ruled-lines-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C662"/>
      <stop offset="55%" stop-color="#E0A94A"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <radialGradient id="ruled-lines-disc" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0%" stop-color="#3C2A1E"/>
      <stop offset="100%" stop-color="#160F0A"/>
    </radialGradient>
    <clipPath id="ruled-lines-clip">
      <circle cx="80" cy="80" r="70"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#ruled-lines-disc)"/>
  <g clip-path="url(#ruled-lines-clip)">
    <g transform="translate(28.00 6.80) scale(0.52)">
    <path d="M84 152 L50 138" stroke="#C9922A" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M116 152 L150 138" stroke="#C9922A" stroke-width="15" fill="none" stroke-linecap="round"/><circle cx="100" cy="148" r="14" fill="url(#ruled-lines-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#ruled-lines-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#ruled-lines-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M80 102 Q100 118 120 102" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g><g transform="translate(44 94)"><rect x="0" y="0" width="72" height="56" rx="5" fill="#F8F2E5"/><g><rect x="5" y="6" width="4" height="9" rx="1.4" fill="#4A7A4A"/><rect x="9" y="6" width="58" height="9" fill="#4A7A4A" opacity="0.18"/><rect x="52" y="8.6" width="12" height="3.8" rx="1.9" fill="#1A0F0B" opacity="0.34"/></g><g><rect x="5" y="18" width="4" height="9" rx="1.4" fill="#C9922A"/><rect x="9" y="18" width="58" height="9" fill="#C9922A" opacity="0.2"/><rect x="52" y="20.6" width="12" height="3.8" rx="1.9" fill="#1A0F0B" opacity="0.34"/></g><g><rect x="5" y="30" width="4" height="9" rx="1.4" fill="#4A6F94"/><rect x="9" y="30" width="58" height="9" fill="#4A6F94" opacity="0.18"/><rect x="52" y="32.6" width="12" height="3.8" rx="1.9" fill="#1A0F0B" opacity="0.34"/></g><g><rect x="5" y="42" width="4" height="9" rx="1.4" fill="#B03028"/><rect x="9" y="42" width="58" height="9" fill="#B03028" opacity="0.18"/><rect x="52" y="44.6" width="12" height="3.8" rx="1.9" fill="#1A0F0B" opacity="0.34"/></g><rect x="46" y="0" width="1.6" height="56" fill="#1A0F0B" opacity="0.16"/></g><path d="M124 34 Q125.1 37.9 129 39 Q125.1 40.1 124 44 Q122.9 40.1 119 39 Q122.9 37.9 124 34 Z" fill="#F0C662" opacity="0.9"/>
  </g>
  <circle cx="80" cy="80" r="72.5" fill="none" stroke="#E0A94A" stroke-width="4"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#E0A94A" stroke-width="1.4" opacity="0.34"/>
</svg>
