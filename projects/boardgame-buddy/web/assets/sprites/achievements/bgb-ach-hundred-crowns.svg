<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hundred Crowns badge — Buddy crowned, with a crown on either side">
  <title>Hundred Crowns badge — Buddy crowned, with a crown on either side</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold. -->
  <defs>
    <linearGradient id="hundred-crowns-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C662"/>
      <stop offset="55%" stop-color="#E0A94A"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <radialGradient id="hundred-crowns-disc" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0%" stop-color="#3C2A1E"/>
      <stop offset="100%" stop-color="#160F0A"/>
    </radialGradient>
    <clipPath id="hundred-crowns-clip">
      <circle cx="80" cy="80" r="70"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#hundred-crowns-disc)"/>
  <g clip-path="url(#hundred-crowns-clip)">
    <g transform="translate(30.00 41.00) scale(0.5)">
    <circle cx="100" cy="148" r="14" fill="url(#hundred-crowns-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#hundred-crowns-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#hundred-crowns-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M80 102 Q100 118 120 102" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g><g transform="translate(63 30)"><path d="M0 21.1 L0 3.8 L8.5 11.0 L17.0 0 L25.5 11.0 L34.0 3.8 L34.0 21.1 Z" fill="url(#hundred-crowns-gold)"/><rect x="0" y="21.1" width="34.0" height="4.8" rx="2.0" fill="url(#hundred-crowns-gold)"/></g><g transform="translate(22 62)"><path d="M0 13.6 L0 2.5 L5.5 7.1 L11.0 0 L16.5 7.1 L22.0 2.5 L22.0 13.6 Z" fill="#F0C662"/><rect x="0" y="13.6" width="22.0" height="3.1" rx="1.3" fill="#F0C662"/></g><g transform="translate(116 62)"><path d="M0 13.6 L0 2.5 L5.5 7.1 L11.0 0 L16.5 7.1 L22.0 2.5 L22.0 13.6 Z" fill="#F0C662"/><rect x="0" y="13.6" width="22.0" height="3.1" rx="1.3" fill="#F0C662"/></g><path d="M80 8 Q81.3 12.7 86 14 Q81.3 15.3 80 20 Q78.7 15.3 74 14 Q78.7 12.7 80 8 Z" fill="#F0C662" opacity="0.9"/>
  </g>
  <circle cx="80" cy="80" r="72.5" fill="none" stroke="#BFB4A4" stroke-width="4"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#BFB4A4" stroke-width="1.4" opacity="0.34"/>
