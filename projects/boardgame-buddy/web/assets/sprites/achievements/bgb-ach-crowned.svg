<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crowned badge — Buddy wearing a winner's crown">
  <title>Crowned badge — Buddy wearing a winner's crown</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold. -->
  <defs>
    <linearGradient id="crowned-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C662"/>
      <stop offset="55%" stop-color="#E0A94A"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <radialGradient id="crowned-disc" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0%" stop-color="#3C2A1E"/>
      <stop offset="100%" stop-color="#160F0A"/>
    </radialGradient>
    <clipPath id="crowned-clip">
      <circle cx="80" cy="80" r="70"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#crowned-disc)"/>
  <g clip-path="url(#crowned-clip)">
    <g transform="translate(22.00 28.20) scale(0.58)">
    <circle cx="100" cy="148" r="14" fill="url(#crowned-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#crowned-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#crowned-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M80 102 Q100 118 120 102" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g><g transform="translate(58 22)"><path d="M0 27.3 L0 4.9 L11.0 14.2 L22.0 0 L33.0 14.2 L44.0 4.9 L44.0 27.3 Z" fill="url(#crowned-gold)"/><rect x="0" y="27.3" width="44.0" height="6.2" rx="2.6" fill="url(#crowned-gold)"/></g><path d="M38 39 Q39.1 42.9 43 44 Q39.1 45.1 38 49 Q36.9 45.1 33 44 Q36.9 42.9 38 39 Z" fill="#F0C662" opacity="0.9"/><path d="M124 41 Q125.1 44.9 129 46 Q125.1 47.1 124 51 Q122.9 47.1 119 46 Q122.9 44.9 124 41 Z" fill="#F0C662" opacity="0.9"/>
  </g>
  <circle cx="80" cy="80" r="72.5" fill="none" stroke="#A9682F" stroke-width="4"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#A9682F" stroke-width="1.4" opacity="0.34"/>
