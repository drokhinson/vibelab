<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="You're an Inspiration badge — Buddy's page sparking a new page of someone else's, under a lit bulb">
  <title>You're an Inspiration badge — Buddy's page sparking a new page of someone else's, under a lit bulb</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold; a standalone badge like this one is gold.

       Distinct from Cited Source (Buddy handing the SAME page along): here the
       page on the right is a different page, with different lines and a pencil
       on it, grown out of Buddy's under a lit bulb. -->
  <defs>
    <linearGradient id="inspiration-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C662"/>
      <stop offset="55%" stop-color="#E0A94A"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <radialGradient id="inspiration-disc" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0%" stop-color="#3C2A1E"/>
      <stop offset="100%" stop-color="#160F0A"/>
    </radialGradient>
    <radialGradient id="inspiration-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F0C662" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0C662" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inspiration-clip">
      <circle cx="80" cy="80" r="70"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#inspiration-disc)"/>
  <g clip-path="url(#inspiration-clip)">
    <!-- The bulb: glow, rays, glass, screw base. -->
    <circle cx="104" cy="40" r="26" fill="url(#inspiration-glow)"/>
    <g stroke="#F0C662" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
      <path d="M104 14 L104 19"/>
      <path d="M84 22 L87.5 25.5"/>
      <path d="M124 22 L120.5 25.5"/>
      <path d="M78 40 L83 40"/>
      <path d="M130 40 L125 40"/>
    </g>
    <path d="M104 26 C95.7 26 90 32 90 39.2 C90 44.4 93 47.6 95.6 50.4 C97.2 52.2 98 53.8 98 56 L110 56 C110 53.8 110.8 52.2 112.4 50.4 C115 47.6 118 44.4 118 39.2 C118 32 112.3 26 104 26 Z" fill="url(#inspiration-gold)"/>
    <path d="M100 50 Q104 43 108 50" stroke="#1A0F0B" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.55"/>
    <rect x="98.5" y="57.5" width="11" height="3.4" rx="1.4" fill="#C9922A"/>
    <rect x="99.5" y="62.2" width="9" height="3.2" rx="1.4" fill="#A9682F"/>

    <!-- Buddy's page, bottom left: the original. -->
    <g transform="translate(62 94) rotate(-6)"><rect x="0" y="0" width="26" height="33.8" rx="2.6" fill="#F8F2E5"/><rect x="4.2" y="8.8" width="17.7" height="2.4" rx="1.2" fill="#1A0F0B" opacity="0.42"/><rect x="4.2" y="15.2" width="17.7" height="2.4" rx="1.2" fill="#1A0F0B" opacity="0.42"/><rect x="4.2" y="21.6" width="11.4" height="2.4" rx="1.2" fill="#1A0F0B" opacity="0.42"/></g>

    <!-- The new page, right: someone else's version, with its own lines and a pencil. -->
    <g transform="translate(106 86) rotate(9)"><rect x="0" y="0" width="26" height="33.8" rx="2.6" fill="#F8F2E5"/><rect x="4.2" y="7.6" width="12" height="2.4" rx="1.2" fill="#1A0F0B" opacity="0.42"/><rect x="4.2" y="13.6" width="17.7" height="2.4" rx="1.2" fill="#1A0F0B" opacity="0.42"/><rect x="4.2" y="19.6" width="14.6" height="2.4" rx="1.2" fill="#1A0F0B" opacity="0.42"/><rect x="4.2" y="25.6" width="8" height="2.4" rx="1.2" fill="#C9922A" opacity="0.8"/></g>
    <g transform="translate(128 100) rotate(38)"><rect x="0" y="0" width="5" height="22" rx="1" fill="#E0A94A"/><rect x="0" y="0" width="5" height="4" rx="1" fill="#B03028"/><path d="M0 22 L2.5 27 L5 22 Z" fill="#F8F2E5"/><path d="M1.8 25.4 L2.5 27 L3.2 25.4 Z" fill="#1A0F0B"/></g>

    <!-- The spark: dotted arc from Buddy's page, through the bulb's light, to the new one. -->
    <path d="M80 92 Q94 66 110 84" stroke="#F0C662" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.85"/>

    <!-- Buddy, lower left, looking up at it. -->
    <g transform="translate(-6.00 64.00) scale(0.40)">
    <path d="M84 152 L56 132" stroke="#C9922A" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M116 152 L166 144" stroke="#C9922A" stroke-width="15" fill="none" stroke-linecap="round"/><circle cx="100" cy="148" r="14" fill="url(#inspiration-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#inspiration-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#inspiration-gold)"/>
    <circle cx="86" cy="76" r="6" fill="#1A0F0B"/>
    <circle cx="124" cy="76" r="6" fill="#1A0F0B"/>
    <path d="M80 98 Q102 124 124 98" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M40 34 Q41.1 37.9 45 39 Q41.1 40.1 40 44 Q38.9 40.1 35 39 Q38.9 37.9 40 34 Z" fill="#F0C662" opacity="0.8"/>
  </g>
  <circle cx="80" cy="80" r="72.5" fill="none" stroke="#E0A94A" stroke-width="4"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#E0A94A" stroke-width="1.4" opacity="0.34"/>
</svg>
