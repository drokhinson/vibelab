<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Duelist badge — Buddy over a two-player board with a pawn dug in on either side">
  <title>Duelist badge — Buddy over a two-player board with a pawn dug in on either side</title>
