<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Table Chronicler badge — Buddy writing the night down with a quill">
  <title>Table Chronicler badge — Buddy writing the night down with a quill</title>
