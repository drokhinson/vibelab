<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Table Regular badge — Buddy at the table with a meeple and a die">
  <title>Table Regular badge — Buddy at the table with a meeple and a die</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold. -->
  <defs>
    <linearGradient id="table-regular-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C662"/>
      <stop offset="55%" stop-color="#E0A94A"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <radialGradient id="table-regular-disc" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0%" stop-color="#3C2A1E"/>
      <stop offset="100%" stop-color="#160F0A"/>
    </radialGradient>
    <clipPath id="table-regular-clip">
      <circle cx="80" cy="80" r="70"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#table-regular-disc)"/>
  <g clip-path="url(#table-regular-clip)">
    <path d="M8 118 H152" stroke="#8A5A32" stroke-width="5" stroke-linecap="round"/><rect x="8" y="118" width="144" height="34" fill="#6B4526" opacity="0.55"/><g transform="translate(22.00 10.20) scale(0.58)">
    <circle cx="100" cy="148" r="14" fill="url(#table-regular-gold)"/>
    <rect x="84" y="158" width="32" height="22" rx="9" fill="url(#table-regular-gold)"/>
    <rect x="55" y="40" width="90" height="90" rx="20" fill="url(#table-regular-gold)"/>
    <circle cx="80" cy="80" r="6" fill="#1A0F0B"/>
    <circle cx="120" cy="80" r="6" fill="#1A0F0B"/>
    <path d="M80 102 Q100 118 120 102" stroke="#1A0F0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g><g transform="translate(60 118) scale(1.0)" fill="#F8F2E5" opacity="1.0"><circle cx="0" cy="-11" r="4"/><path d="M-6 0 L-6 -6 Q-6 -9 -2 -8 L2 -8 Q6 -9 6 -6 L6 0 Z"/></g><rect x="96" y="104" width="15" height="15" rx="3.0" fill="#F8F2E5"/><circle cx="100.5" cy="108.5" r="1.3" fill="#1A0F0B"/><circle cx="106.5" cy="114.5" r="1.3" fill="#1A0F0B"/>
  </g>
  <circle cx="80" cy="80" r="72.5" fill="none" stroke="#A9682F" stroke-width="4"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#A9682F" stroke-width="1.4" opacity="0.34"/>
</svg>
