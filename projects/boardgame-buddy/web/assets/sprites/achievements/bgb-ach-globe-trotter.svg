<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Globe Trotter badge — Buddy behind a globe, a dashed route drawn between two continents">
  <title>Globe Trotter badge — Buddy behind a globe, a dashed route drawn between two continents</title>
  <!-- BoardgameBuddy achievement badge. The medallion keeps its own dark
       ground in both themes on purpose (.claude/rules/assets.md): it is a coin
       on the table, not a mark drawn against the page. The rim colour is the
       tier — bronze, silver, gold. -->
