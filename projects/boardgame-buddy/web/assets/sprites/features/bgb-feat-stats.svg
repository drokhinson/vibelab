<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="A podium with the first place crowned">
  <!-- A podium, tallest in the middle, with the winner's marker floating over
       it. Reads as a record rather than as a generic bar chart. -->
  <circle cx="12" cy="3.3" r="1.9"/>
  <rect x="9.3" y="6.9" width="5.4" height="14.4" rx="1.3"/>
  <rect x="2.1" y="10.9" width="5.4" height="10.4" rx="1.3"/>
  <rect x="16.5" y="14.1" width="5.4" height="7.2" rx="1.3"/>
</svg>
