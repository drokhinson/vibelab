<!DOCTYPE html>
<html lang="en" data-theme="luxury">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Resolve every relative URL (scripts, styles, assets/, the buddyLoader
       mark) against the deploy root, not the current route. The History-API
       router (domain/view.js) puts multi-segment paths like /game/:id/chapters
       and /play/:code in the address bar; without this, relative refs resolve
       against /game/:id/ and 404 — broken loader images, and dead scripts on a
       cold deep-link refresh. Source files keep their relative paths per
       .claude/rules/assets.md; only resolution changes. -->
  <base href="/" />
  <title>Boardgame Buddy</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/bgb-logo.svg" />
  <!-- Installable PWA. The point isn't the home-screen icon, it's that sw.js
       precaches the shell so the app opens with no signal — which is what
       makes offline hosting work for someone who closed the tab. -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a0f0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/brand/bgb-icon-192.png" />

  <!-- DaisyUI v4 + Tailwind CSS (no build step). Local dev only: the deploy
       workflow (.github/workflows/deploy-frontend*.yml) swaps this CDN pair
       for a precompiled assets/bgb-tw.css in the deployed artifact. Keep the
       Tailwind CDN script un-deferred — the runtime JIT compiler must run
       before first paint locally. -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons (deferred — init.js waits for DOMContentLoaded) -->
  <script defer src="https://unpkg.com/lucide@1/dist/umd/lucide.min.js"></script>

  <!-- Supabase JS Client (deferred — only used from DOMContentLoaded onward) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Fonts: Poppins (UI) + Crimson Text (display) + Fraunces / JetBrains Mono (polaroid card) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Crimson+Text:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&family=JetBrains+Mono:wght@500;700&display=swap" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="max-w-[480px] mx-auto min-h-screen flex flex-col">

    <!-- Global app header — persists across views once the user is signed in.
         Brand on the left routes back to the feed; avatar on the right opens
         the user's profile. Hidden on splash / auth via data-auth-only. -->
    <header data-auth-only class="hidden bgb-global-header">
      <a class="bgb-global-header__brand" onclick="window.router.go('feed')">
        <img src="assets/brand/bgb-logo.svg" alt="" class="bgb-global-header__logo" />
        <!-- BGG attribution lives on the Settings screen
             (settings-view.js#_renderBggAttribution), not here — the header
             stays a clean logo + wordmark lockup. -->
        <span class="bgb-global-header__title font-display">Boardgame Buddy</span>
      </a>
      <button class="bgb-global-header__avatar" title="Settings"
              onclick="window.router.go('settings')">
        <!-- Placeholder; init.js#syncGlobalAvatar replaces this with a BgbBadge
             once the user store fires. -->
        <span id="bgb-global-avatar" class="user-badge user-badge--sm"
              style="background:#2a1812;color:#C9922A">?</span>
      </button>
    </header>

    <!-- Offline banner. Sits between the header and the views so it reads as
         app state rather than screen content, and so no individual view has to
         remember to render it. init.js#syncOfflineBanner drives it from the
         store's `offline` slot; hidden whenever the app is connected. -->
    <div id="bgb-offline-banner" class="bgb-offline-banner hidden" role="status"></div>

    <!-- ── Views ────────────────────────────────────────────────────────────── -->
    <!-- The loader mark is inlined rather than left to SplashView.render() so
         the browser paints it as soon as CSS is ready. Every script below is
         parser-blocking, so a render() that only runs on DOMContentLoaded
         leaves the user on a blank page until ~24k lines of JS have downloaded
         and executed. Keep this markup in sync with views/splash-view.js. -->
    <main data-view="splash" class="flex-1 px-4 py-4 flex flex-col items-center justify-center min-h-[60vh]">
      <img src="assets/illustrations/bgb-loading.svg" alt="Loading"
           style="width:176px;height:176px;" class="rounded-2xl" />
    </main>
    <main data-view="auth" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="feed" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="log-play" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="play-flow" class="hidden flex-1 px-0 py-0"></main>
    <main data-view="game-explorer" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="game-detail" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="reference-guide-add" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="profile-self" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="profile-other" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="collection" class="hidden flex-1 px-4 py-4 bgb-cream-screen"></main>
    <main data-view="wishlist" class="hidden flex-1 px-4 py-4 bgb-cream-screen"></main>
    <main data-view="plays" class="hidden flex-1 px-4 py-4 bgb-cream-screen"></main>
    <main data-view="session-viewer" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="buddies" class="hidden flex-1 px-4 py-4 bgb-cream-screen"></main>
    <main data-view="settings" class="hidden flex-1 px-4 py-4 bgb-cream-screen"></main>
    <main data-view="admin" class="hidden flex-1 px-4 py-4"></main>

    <!-- Toast -->
    <div id="toast" class="toast toast-end toast-top hidden z-50"></div>
  </div>

  <!-- Bottom nav: a flat, edge-to-edge rectangular bar with three equal
       tabs. Play carries a gold icon chip so it still reads as the primary
       action, but nothing breaks the bar's rectangle. data-nav is the
       destination on tap; data-nav-views (when present) is a comma-separated
       list of view names that keep this tab marked active — so the Play tab
       stays lit throughout play-flow, the game explorer, and the joiner's
       session-viewer mirror. -->
  <nav class="hidden bgb-nav" data-auth-only>
    <button class="bgb-nav__tab" data-nav="feed">
      <span class="bgb-nav__ico">
        <i data-lucide="home" class="w-5 h-5"></i>
      </span>
      <span class="bgb-nav__label">Feed</span>
    </button>
    <button class="bgb-nav__tab bgb-nav__tab--play" data-nav="log-play"
            data-nav-views="play-flow,log-play,game-explorer,session-viewer">
      <span class="bgb-nav__ico">
        <i data-lucide="dices" class="w-5 h-5"></i>
      </span>
      <span class="bgb-nav__label">Play</span>
    </button>
    <button class="bgb-nav__tab" data-nav="profile-self"
            data-nav-views="profile-self,collection,wishlist,plays,buddies,settings">
      <span class="bgb-nav__ico">
        <i data-lucide="user" class="w-5 h-5"></i>
      </span>
      <span class="bgb-nav__label">Profile</span>
    </button>
  </nav>

  <!-- Load order: config → helpers → domain → ui → views → init -->
  <script src="config.js"></script>
  <script src="helpers.js"></script>

  <!-- Domain -->
  <script src="domain/api.js"></script>
  <script src="domain/store.js"></script>
  <script src="domain/net.js"></script>
  <script src="domain/outbox.js"></script>
  <script src="domain/cache.js"></script>
  <script src="domain/view.js"></script>
  <script src="domain/user.js"></script>
  <script src="domain/game.js"></script>
  <script src="domain/shelf-filter.js"></script>
  <script src="domain/shelf-controller.js"></script>
  <script src="domain/collection.js"></script>
  <script src="domain/play.js"></script>
  <script src="domain/play-session.js"></script>
  <script src="domain/live-scores.js"></script>
  <script src="domain/session-phase.js"></script>
  <script src="domain/buddy.js"></script>
  <script src="domain/feed.js"></script>
  <script src="domain/stats.js"></script>
  <script src="domain/bgg.js"></script>
  <script src="domain/chapter.js"></script>
  <script src="domain/profile.js"></script>
  <script src="domain/bootstrap.js"></script>

  <!-- UI components -->
  <script src="ui/viewport-lock.js"></script>
  <script src="ui/oauth-buttons.js"></script>
  <script src="ui/user-badge.js"></script>
  <script src="ui/play-card.js"></script>
  <script src="ui/game-card.js"></script>
  <script src="ui/status-tag.js"></script>
  <script src="ui/markdown.js"></script>
  <script src="ui/polaroid-popup.js"></script>

  <!-- Widgets -->
  <script src="widgets/reference-guide-scroll.js"></script>
  <script src="widgets/round-score-grid.js"></script>
  <script src="widgets/play-detail-popup.js"></script>
  <script src="widgets/game-finder.js"></script>
  <script src="widgets/join-panel.js"></script>
  <script src="widgets/add-game-modal.js"></script>
  <script src="widgets/import-expansions-modal.js"></script>

  <!-- Views -->
  <script src="views/splash-view.js"></script>
  <script src="views/auth-view.js"></script>
  <script src="views/feed-view.js"></script>
  <script src="views/log-play-view.js"></script>
  <script src="views/play-flow-view.js"></script>
  <script src="views/game-explorer-view.js"></script>
  <script src="views/game-detail-view.js"></script>
  <script src="views/reference-guide-add-view.js"></script>
  <script src="views/profile-self-view.js"></script>
  <script src="views/profile-other-view.js"></script>
  <script src="views/collection-view.js"></script>
  <script src="views/wishlist-view.js"></script>
  <script src="views/plays-view.js"></script>
  <script src="views/session-viewer-view.js"></script>
  <script src="views/buddies-view.js"></script>
  <script src="views/settings-view.js"></script>
  <script src="views/admin-view.js"></script>

  <script src="init.js"></script>
</body>
</html>
