<!DOCTYPE html>
<html lang="en" data-theme="luxury">
<head>
  <meta charset="UTF-8" />
  <!-- Locked at 1x. The chrome (.bgb-global-header sticky, .bgb-nav fixed) is laid
       out against the layout viewport, which zoom doesn't change — so a zoomed page
       renders both bars scaled up and running off the sides of the visible box.
       maximum-scale/user-scalable cover Android Chrome and iOS *standalone* (home
       screen) mode; iOS Safari 10+ ignores them in a normal tab, which is what
       ui/zoom-lock.js is for. Double-tap zoom and the <16px focus auto-zoom are
       handled in styles.css — see the Layout block.
       No viewport-fit=cover: all 13 env(safe-area-inset-*) usages in styles.css
       currently resolve to 0px, and turning them real would shift the nav, #app's
       bottom padding, three cascade CTA offsets and every modal at once — and with
       apple-mobile-web-app-status-bar-style=black-translucent above, push header
       content under the clock in standalone. Separate, device-tested change. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Resolve every relative URL (scripts, styles, assets/, the buddyLoader
       mark) against the deploy root, not the current route. The History-API
       router (domain/view.js) puts multi-segment paths like /game/:id/chapters
       and /play/:code in the address bar; without this, relative refs resolve
       against /game/:id/ and 404 — broken loader images, and dead scripts on a
       cold deep-link refresh. Source files keep their relative paths per
       .claude/rules/assets.md; only resolution changes. -->
  <base href="/" />
  <title>Boardgame Buddy — Games Played, Nights Remembered.</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/bgb-logo.svg" />

  <!-- Link preview. The app is shared by URL constantly — a session link into
       a group chat is a core flow — and with none of this a paste renders as a
       bare address with no card at all.
       Absolute URLs, not relative: a scraper resolves these against nothing.
       A raster og:image, not the SVG beside it: Facebook, X, iMessage, Slack
       and Discord all decline an SVG preview, most of them silently.
       Two things worth knowing before editing these.
       * assets/ is immutable for a year (_headers), and scrapers cache
         aggressively on top of that, so REPLACING the banner in place will not
         change the card. Ship a new filename and point og:image at it.
       * og:url is the site root on every route. This is a static SPA, so the
         scraper that fetches /play/ABCD gets the same index.html the router
         gets — there is no per-play card without rendering one at the edge.
         The generic card is the honest answer, not a placeholder. -->
  <meta name="description" content="Games Played, Nights Remembered. Keep score, have your reference guide handy mid-game, and see what your buddies have been playing." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Boardgame Buddy" />
  <meta property="og:title" content="Boardgame Buddy" />
  <meta property="og:description" content="Games Played, Nights Remembered." />
  <meta property="og:url" content="https://bgbuddy.app/" />
  <meta property="og:image" content="https://bgbuddy.app/assets/brand/bgb-og-banner.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Boardgame Buddy — Games Played, Nights Remembered." />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Installable PWA. The point isn't the home-screen icon, it's that sw.js
       precaches the shell so the app opens with no signal — which is what
       makes offline hosting work for someone who closed the tab. -->
  <link rel="manifest" href="manifest.json" />
  <!-- The same dark ground manifest.json paints the installed splash with. -->
  <meta name="theme-color" content="#1A1310" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/brand/bgb-icon-192.png" />

  <!-- DaisyUI v4 + Tailwind CSS (no build step). Local dev only: the deploy
       workflow (.github/workflows/deploy-frontend*.yml) swaps this CDN pair
       for a precompiled assets/bgb-tw.css in the deployed artifact. Keep the
       Tailwind CDN script un-deferred — the runtime JIT compiler must run
       before first paint locally. -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS Client (deferred — only used from DOMContentLoaded onward).
       Still loaded after the auth swap: Identity Platform replaces Supabase
       Auth, not Supabase. Realtime and the live-session tables go through this
       client either way — see domain/auth.js#init. -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Firebase Auth (GCP Identity Platform), deferred for the same reason.
       The COMPAT build on purpose: it exposes a `firebase` global usable from a
       classic script, which is the authoring model here (~121 plain <script
       src> tags, no bundler — .claude/rules/web-frontend.md). The modular v9+
       SDK is ESM-only and would need a module script the bundler does not fold.

       Version is PINNED rather than floating, unlike the supabase line above.
       This one sits on the sign-in path with no fallback: a breaking change in
       a minor release locks every user out, and there is no way to notice
       before they do.

       Loaded unconditionally, including on the two legal routes that need no
       auth at all. That is ~90 KB gzip of parked bytes on those pages, which
       is the trade for not having a conditional script tag that the bundler
       and sw.js's derived precache list would both have to learn about. -->
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <!-- Google Fonts: Geist (UI) + Fraunces (display + polaroid) + JetBrains Mono (scores).
       Crimson Text was dropped — --font-display is aliased to Fraunces in styles.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&family=JetBrains+Mono:wght@500;700&display=swap" />

  <!-- Theme boot. Runs before first paint so there is no flash of the wrong
       theme: stored choice wins, otherwise the OS preference. Kept inline and
       dependency-free on purpose — init.js is far too late for this. -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("bgb.theme"); } catch (e) {}
      var mode = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light" : "dark");
      document.documentElement.setAttribute("data-bgb", mode);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", mode === "light" ? "#F7F0E1" : "#1A1310");
    })();
  </script>

  <!-- Layout boot. Same contract as the theme boot above, for the layout
       tier (phone / tablet / wide / land — see domain/layout.js, which owns
       every change after this): the viewport decides, and nothing overrides it.
       Before first paint so a tablet never flashes the phone column, and so a
       phone picked up sideways never flashes the bottom bar. Keep the
       breakpoints and the land query in step with domain/layout.js — this
       block deliberately duplicates that ladder, and the deploy bundler ships
       it verbatim. It no longer reads `bgb.layout`: the Settings pin that wrote
       that key is gone, and a leftover value must not keep steering the layout
       with nothing left to clear it. -->
  <script>
    (function () {
      var mm = window.matchMedia ? function (q) { return window.matchMedia(q).matches; } : function () { return false; };
      // Height first — a phone on its side passes the tablet width test too.
      var tier = mm("(orientation: landscape) and (max-height: 560px) and (min-width: 640px)")
        ? "land"
        : mm("(min-width: 1024px)") ? "wide" : mm("(min-width: 768px)") ? "tablet" : "phone";
      document.documentElement.setAttribute("data-bgb-layout", tier);
    })();
  </script>

  <!-- Boot backstop. Deliberately here rather than in init.js: the failure this
       covers is init.js NEVER ARRIVING — a stalled bundle, a 404 after a bad
       deploy, a connection that dies mid-download. Every script below is
       parser-blocking, so in that case the splash spins forever and the app's
       own watchdog is part of the code that never ran. HTML + CSS + this one
       script, so it works when nothing else does.

       WHY 15s, AND WHY IT IS NOT "the app is being slow"
       --------------------------------------------------
       init.js cancels this the moment it arms its watchdog, and that watchdog
       GUARANTEES the app leaves the splash. So reaching this timer means no app
       code ran at all — never that a working boot is taking its time. That
       distinction is the whole point: the previous version fired at 8s, i.e.
       ~4s BEFORE the 12s watchdog could rescue the boot, so every slow-but-fine
       launch was offered a reload button that would have thrown away work about
       to finish. 15s clears the watchdog's own worst case.

       Since we know no code is alive, a reload is the only possible recovery —
       so retry by ourselves rather than asking. Capped and backing off, because
       an uncapped loop hammers a server that may be down and never tells the
       user anything. -->
  <script>
    (function () {
      // Wait before each attempt. First rung must clear init.js's watchdog.
      var RETRY_DELAYS_MS = [15000, 25000, 45000];
      var KEY = "bgb.bootRetry";

      // sessionStorage, not a variable: this survives the reloads it causes,
      // and dies with the tab, so a fresh tab starts at rung one.
      function attempts() {
        try { return parseInt(sessionStorage.getItem(KEY), 10) || 0; } catch (e) { return 0; }
      }
      function remember(n) {
        try { sessionStorage.setItem(KEY, String(n)); } catch (e) {}
      }

      var n = attempts();
      if (n >= RETRY_DELAYS_MS.length) {
        // Ladder spent. Stop reloading and say so — the loader alone would be a
        // lie at this point.
        document.documentElement.setAttribute("data-bgb-boot-failed", "");
        return;
      }

      function retry() {
        remember(n + 1);
        location.reload();
      }

      window.__bgbBootRetry = setTimeout(function () {
        // Offline is not a failed attempt. Reloading with no link only reaches
        // the browser's error page, so it would burn a rung and learn nothing.
        // Waiting costs nothing and `online` is the fastest retry available.
        if (navigator.onLine === false) {
          window.addEventListener("online", retry, { once: true });
          return;
        }
        retry();
      }, RETRY_DELAYS_MS[n]);
    })();
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The column width is a token (--bgb-col-max, styles.css #app), not a
       Tailwind class: it changes per layout tier and every docked bar pins
       to the same number. -->
  <div id="app" class="min-h-screen flex flex-col">

    <!-- Global app header — persists across views once the user is signed in.
         Brand on the left routes back to the feed; the gear on the right opens
         Settings. Hidden on splash / auth via data-auth-only. -->
    <header data-auth-only class="hidden bgb-global-header">
      <a class="bgb-global-header__brand" onclick="window.router.go('feed')">
        <img src="assets/brand/bgb-logo.svg" alt="" class="bgb-global-header__logo" />
        <!-- BGG attribution lives on the Settings screen
             (settings-view.js#_renderBggAttribution), not here — the header
             stays a clean logo + wordmark lockup. -->
        <span class="bgb-global-header__title font-display">Boardgame Buddy</span>
      </a>
      <!-- Everything done TO you: plays somebody seated you in, buddy requests,
           requests of yours that were accepted. Sits where the pending-upload
           control used to: uploads are a thing the app is doing FOR you and
           belong in Settings with the rest of the plumbing, whereas being put
           in someone else's game is a thing done TO you and needs answering.
           Its dot is the same .bgb-global-header__dot the gear wears, driven by
           init.js#syncHeaderDot off BgbNotifications.forBell().

           It TOGGLES. The screen has no close x — this button is its only
           opener, so it is also its closer, and back means the same thing. Its
           box shows that: aria-pressed, set on every navigation by
           domain/view.js#go, lights and turns it while the screen is open. -->
      <button class="bgb-global-header__bell" title="Notifications" aria-label="Notifications"
              data-toggle="notifications" aria-pressed="false"
              onpointerdown="window.NotificationFeed && window.NotificationFeed.warm()"
              onclick="window.toggleNotifications()">
        <i data-icon="bell" class="w-5 h-5"></i>
        <span class="bgb-global-header__dot" aria-hidden="true" hidden></span>
      </button>
      <!-- Gear, not the user's badge. The button has always led to Settings, but
           an avatar reads as "my profile" — and Profile already has its own
           bottom-nav tab, so the badge here was both redundant and misleading.
           Toggles, and wears its screen's state, exactly like the bell above. -->
      <button class="bgb-global-header__settings" title="Settings" aria-label="Settings"
              data-toggle="settings" aria-pressed="false"
              onclick="window.toggleSettings()">
        <i data-icon="gear" class="w-5 h-5"></i>
        <!-- Admin review dot. Same contract as .bgb-nav__dot: aria-hidden, so
             the button's own aria-label is what changes when work is waiting.
             init.js#syncGearDot drives it off BgbNotifications.forGear(). -->
        <span class="bgb-global-header__dot" aria-hidden="true" hidden></span>
      </button>
    </header>

    <!-- ── Views ────────────────────────────────────────────────────────────── -->
    <!-- The loader mark is inlined rather than left to SplashView.render() so
         the browser paints it as soon as CSS is ready. Every script below is
         parser-blocking, so a render() that only runs on DOMContentLoaded
         leaves the user on a blank page until ~24k lines of JS have downloaded
         and executed. Keep this markup in sync with views/splash-view.js. -->
    <main data-view="splash" class="flex-1 px-4 py-4 flex flex-col items-center justify-center min-h-[60vh]">
      <img src="assets/illustrations/bgb-loading.svg" alt="Loading"
           style="width:176px;height:176px;" class="rounded-2xl" />
      <!-- Hidden until <html data-bgb-boot-failed>, which the <head> script sets
           only after its three automatic reloads have all failed. Nothing here
           appears on a boot that is merely slow — the app's watchdog handles
           those, and offering a reload mid-boot only invites throwing away work
           that was about to finish.
           location.reload() rather than an href so a deep link like
           /play/{code} reloads itself rather than bouncing to the root. -->
      <div class="bgb-boot-failed" role="alert">
        <p class="bgb-boot-failed__msg">Couldn't load Boardgame Buddy.<br />Check your connection.</p>
        <button type="button" class="bgb-boot-failed__btn" onclick="location.reload()">
          Try again
        </button>
      </div>
    </main>
    <main data-view="privacy" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="terms" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="auth" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="tour" class="hidden flex-1"></main>
    <main data-view="feed" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="discovery" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="log-play" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="play-flow" class="hidden flex-1 px-0 py-0"></main>
    <main data-view="game-explorer" class="hidden flex-1 px-4 py-4"></main>
    <main data-view="add-games" class="hidden flex-1 px-4 py-4 bgb-spoke-screen"></main>
    <main data-view="game-detail" class="hidden flex-1 px-4 py-4"></main>

    <!-- No container padding: the cascade screens inside own their own
         gutters, exactly like play-flow above. The old px-4 py-4 doubled up
         with .cascade-screen's 12px/16px and squeezed the spectator's cards

    <main data-view="session-viewer" class="hidden flex-1 px-0 py-0"></main>

    <!-- Toast -->
    <div id="toast" class="toast toast-end toast-top hidden"></div>

  <!-- Bottom nav: a flat, edge-to-edge rectangular bar with four equal
       tabs. Play carries a gold icon chip so it still reads as the primary
       action, but nothing breaks the bar's rectangle. data-nav is the
       destination on tap; data-nav-views (when present) is a comma-separated
       list of view names that keep this tab marked active — so the Play tab
       stays lit throughout play-flow, the game explorer, and the joiner's
       session-viewer mirror. -->
  <nav class="hidden bgb-nav" data-auth-only>
    <!-- Wide tier only (styles.css, the "Left rail" block): on a screen wide
         enough for the rail the global header is hidden and the rail carries
         its lockup and its two utilities instead. The brand mark routes home
         exactly as the header's does; the bell and gear below the tabs are
         the SAME toggles as the header's, sharing their data-toggle name so
         domain/view.js#go lights whichever copy is on screen and
         init.js#syncHeaderDots paints both dots. Hidden on phone and tablet,
         where the header is present and the bar has no room for them. -->
    <a class="bgb-nav__brand" onclick="window.router.go('feed')" aria-label="Boardgame Buddy — Feed">
      <img src="assets/brand/bgb-logo.svg" alt="" class="bgb-nav__logo" />
    </a>
    <button class="bgb-nav__tab" data-nav="feed">
      <span class="bgb-nav__ico">
        <i data-icon="home" class="w-5 h-5"></i>
      </span>
      <span class="bgb-nav__label">Feed</span>
    </button>
    <button class="bgb-nav__tab" data-nav="discovery">
      <span class="bgb-nav__ico">
        <i data-icon="compass" class="w-5 h-5"></i>
      </span>
      <span class="bgb-nav__label">Discover</span>
    </button>
    <button class="bgb-nav__tab bgb-nav__tab--play" data-nav="log-play"

      <span class="bgb-nav__ico">
        <i data-icon="dices" class="w-5 h-5"></i>
      </span>
      <span class="bgb-nav__label">Play</span>
    </button>
    <!-- Settings is deliberately absent from data-nav-views: like
         notifications, it is a header/rail toggle screen rather than a Profile
         spoke, so no tab is lit while it is open (domain/view.js#go). -->
    <button class="bgb-nav__tab" data-nav="profile-self"
            data-nav-views="profile-self,collection,plays,buddies,stats,achievements">
      <span class="bgb-nav__ico">
        <i data-icon="user" class="w-5 h-5"></i>
        <!-- Something is waiting behind this tab — a buddy request, a ghost
             someone thinks is you, a badge nobody has looked at. One dot for
             all of them, and no number: the counts belong on the hub cards
             this tab leads to, where there is room to say what they count.
             init.js#syncNavDots drives it from every store slot
             domain/notifications.js maps to this tab, and swaps the tab's
             accessible name, so the dot itself is decoration. A tab earns a
             dot by having this span — add one here and a matching row in the
             registry, and nothing else changes. -->
        <span class="bgb-nav__dot" aria-hidden="true" hidden></span>
      </span>
      <span class="bgb-nav__label">Profile</span>
    </button>
    <button class="bgb-nav__tab bgb-nav__tab--util" title="Notifications" aria-label="Notifications"
            data-toggle="notifications" aria-pressed="false"
            onpointerdown="window.NotificationFeed && window.NotificationFeed.warm()"
            onclick="window.toggleNotifications()">
      <span class="bgb-nav__ico">
        <i data-icon="bell" class="w-5 h-5"></i>
        <span class="bgb-nav__dot" aria-hidden="true" hidden></span>
      </span>
      <span class="bgb-nav__label">Alerts</span>
    </button>
    <button class="bgb-nav__tab bgb-nav__tab--util" title="Settings" aria-label="Settings"
            data-toggle="settings" aria-pressed="false"
            onclick="window.toggleSettings()">
      <span class="bgb-nav__ico">
        <i data-icon="gear" class="w-5 h-5"></i>
        <span class="bgb-nav__dot" aria-hidden="true" hidden></span>
      </span>
      <span class="bgb-nav__label">Settings</span>
    </button>
  </nav>

  <!-- Load order: config → helpers → domain → ui → views → init -->
  <script src="config.js"></script>
  <!-- Open the connection to the API before anything asks for it. The first
       call of a session otherwise pays DNS + TLS on top of its round trip,
       which is exactly what the game picker's first keystroke feels. The href
       can't be authored statically — apiBase comes from config.js, which
       build.sh generates per environment — so the link is injected here,
       immediately after that config lands and before any domain script runs.
       crossorigin: the API is a different origin and every call is a
       credential-less CORS fetch, so the preconnected socket has to come from
       the anonymous pool or it won't be the one reused. -->
  <script>
    (function () {
      var base = (window.APP_CONFIG && window.APP_CONFIG.apiBase) || "";
      if (!base) return;
      try {
        var origin = new URL(base, window.location.href).origin;
        if (origin === window.location.origin) return;
        var link = document.createElement("link");
        link.rel = "preconnect";
        link.href = origin;
        link.crossOrigin = "anonymous";
        document.head.appendChild(link);
      } catch (e) {}
    })();
  </script>

  <!-- Vendored QR codecs — see each file's header for provenance. Same-origin
       on purpose: sw.js derives its precache list from the src= and href=
       attributes in this file, so a CDN copy would be the one thing missing
       offline.
       rel=prefetch, NOT <script src>: qr-decode.js alone is 258 KB (~9% of the
       app's whole JS budget) and both files serve one flow — the buddy-QR sheet
       — that most sessions never open. ui/lazy-script.js pulls them in on first
       use. They stay listed here because sw.js's precache sweep matches href=
       too, so the codecs still ride the shell into the offline cache; what
       changes is that the parser no longer blocks on them. Chrome fetches a
       prefetch at Lowest priority and Safari ignores the hint outright, so
       neither can compete with /bootstrap on a cold boot. -->
  <link rel="prefetch" href="ui/qr-encode.js" as="script" />
  <link rel="prefetch" href="ui/qr-decode.js" as="script" />
  <!-- The country raster, on the same terms and for the same reasons: 162 KB
       of border data that only the photo importer ever asks for, kept in the
       precache sweep by this href and pulled in on first use by
       domain/geo-grid.js. -->
  <link rel="prefetch" href="domain/geo-grid-data.js" as="script" />
  <!-- The feature tour's animated scenes, on the same terms again. The
       sign-in screen is a signed-out visitor's boot path, so the three
       scene modules must not be on it; views/tour-view.js pulls them in
       through ui/lazy-script.js when somebody actually opens the tour.
       These hrefs are what keeps them inside sw.js's precache sweep, and
       what keeps them OUT of the bundler's manifest, which reads
       <script src> only. -->
  <link rel="prefetch" href="ui/tour-vignette.js" as="script" />
