<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An empty route map">
  <defs>
    <linearGradient id="tgEmptyG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c9bb5"/>
      <stop offset="1" stop-color="#5b6b86"/>
    </linearGradient>
  </defs>
  <rect x="18" y="20" width="204" height="140" rx="16" fill="#f1f3f7" stroke="#dde2ea" stroke-width="2"/>
  <!-- winding route -->
  <path d="M56 132 C 90 118, 78 74, 116 70 S 168 60, 184 40"
        fill="none" stroke="url(#tgEmptyG)" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="2 12"/>
  <!-- start pin -->
  <circle cx="56" cy="132" r="9" fill="#fff" stroke="url(#tgEmptyG)" stroke-width="4"/>
  <!-- mid pin -->
  <g transform="translate(116 70)">
    <path d="M0 -20 C 11 -20, 16 -11, 8 1 L 0 12 L -8 1 C -16 -11, -11 -20, 0 -20 Z" fill="url(#tgEmptyG)"/>
    <circle cx="0" cy="-8" r="4.5" fill="#fff"/>
  </g>
  <!-- end arrow -->
  <g transform="translate(184 40)" fill="url(#tgEmptyG)">
    <path d="M-2 -14 L 14 2 L 4 2 L 4 14 L -8 14 L -8 2 L -18 2 Z" transform="rotate(35)"/>
  </g>
</svg>
