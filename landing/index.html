<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vibelab</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/vibelab-logo.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Crimson+Text:wght@600;700&family=Poppins:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="wordmark">
        <svg class="logo-mark" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="bar" x="4"  y="7"  width="24" height="5" rx="2.5" fill="#a78bfa"/>
          <rect class="bar" x="8"  y="14" width="20" height="5" rx="2.5" fill="#8c83ff"/>
          <rect class="bar" x="12" y="21" width="16" height="5" rx="2.5" fill="#6c63ff"/>
        </svg>
        <span>vibelab</span>
      </div>
      <p class="tagline">Ideas → prototypes → native apps</p>

      <!-- About the Author — themed after David's pursuits: mountains, soccer,
           chess and triathlon. Links to the personal page. -->
      <a class="author-card" href="/about" aria-label="About the author — David Rokhinson">
        <span class="author-card__icons" aria-hidden="true">
          <span class="author-ico author-ico--mtn" title="Mountains">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3.2 19 10 7l3 5.2L15.2 9 21 19Z"/><path d="M13 12.2 15.2 9l1.6 2.8-1.5-.5-.9 1.1-1.4-1.2Z" fill="#fff" opacity=".92"/></svg>
          </span>
          <span class="author-ico author-ico--soccer" title="Soccer">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="#fff"/><path d="m12 7.3 3 2.2-1.1 3.6h-3.8L9 9.5Z" fill="#10151c"/><path d="M12 3.2v2M4.6 9.6l1.9 1.3M19.4 9.6l-1.9 1.3M7.5 19l1-1.9M16.5 19l-1-1.9" stroke="#10151c" stroke-width="1.2" stroke-linecap="round"/></svg>
          </span>
          <span class="author-ico author-ico--chess" title="Chess">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 21h12v-2H6v2Zm2-3h8c1.2-4.6.2-8.4-3.4-10.6l.7-2.2-2.5.7L10 3.5 8.8 6 6.3 7l1.4 1.9C6 10.4 5.6 12.2 5.7 14H8c.1-1 .6-1.8 1.6-2.2-.5 1.1-1.4 2-2.6 2.5V18Z"/></svg>
          </span>
          <span class="author-ico author-ico--tri" title="Triathlon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16.5" r="3.3"/><circle cx="18" cy="16.5" r="3.3"/><path d="M6 16.5 10.5 9H16M9 9h4l3 7.5M12 9l-2 7.5"/></svg>
          </span>
        </span>
        <span class="author-card__text">
          <span class="author-card__eyebrow">About the Author</span>
          <span class="author-card__meta">David Rokhinson · mountains, soccer, chess &amp; triathlon</span>
        </span>
        <span class="author-card__cta" aria-hidden="true">→</span>
      </a>

      <div id="admin-slot" class="admin-slot"></div>
    </div>
  </header>

  <main>
    <section id="featured" class="featured-grid"></section>

    <h2 class="section-heading" id="deferred-heading">Deferred</h2>

    <section id="projects-grid" class="projects-grid">
      <div class="loading">Loading projects…</div>
    </section>
  </main>

  <footer>
    <small>Built in vibelab. Powered by Supabase, Railway &amp; Vercel.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
