<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Served at /travel/:slug (Vercel rewrite → trip.html). base href keeps
       relative script/asset URLs resolving against the site root, not /travel/. -->
  <base href="/" />
  <title>Trip — David Rokhinson</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/vibelab-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    :root{
      --enamel:#123C6B;
      --door:#4E7FA6;
      --terracotta:#B0552E;
      --paper:#E7E3D6;
      --plaque:#FBFAF6;
      --ink:#1E2A33;
      --gold:#F2D46B;
    }
    *{ box-sizing:border-box; }
    /* The page is exactly one viewport and never scrolls — only .stops-scroll
       does. html carries the gradient's end colour so nothing (rubber-band
       overscroll, an iOS repaint hiccup) can ever expose the white canvas;
       that white band under the cards is what this fixes. Because body no
       longer scrolls, the gradient needs no background-attachment:fixed —
       and dropping it is what keeps the iOS bug from coming back. */
    html{ background:#0E2032; }
    html, body{ height:100%; overscroll-behavior:none; }
    body{
      margin:0;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      font-family:'Inter',-apple-system,sans-serif;
      color:#D6DFE7;
      background:radial-gradient(120% 90% at 50% 0%, #2E5C86 0%, #16324B 55%, #0E2032 100%);
    }
    .wrap{
      max-width:860px; margin:0 auto; height:100%;
      display:flex; flex-direction:column;
      padding:1.5rem 1.25rem 0;
    }
    /* `display:flex` above would otherwise defeat the [hidden] attribute's
       display:none, leaving the stop list live (tabbable, and read out by
       screen readers) behind the opaque stop screen. */
    .wrap[hidden]{ display:none; }
    .trip-top{ flex:none; }
    /* The only scroller on the page. min-height:0 is what lets a flex child
       actually shrink below its content; the padding / negative-margin pair
       gives .stop's drop shadow room to render without narrowing the cards. */
    .stops-scroll{
      flex:1 1 auto; min-height:0;
      overflow-y:auto; -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      padding:2px 14px calc(1.25rem + env(safe-area-inset-bottom));
      margin:0 -14px;
    }

    /* ── Top bar ─────────────────────────────────────────────── */
    .topbar{ display:flex; align-items:center; justify-content:space-between; padding:0.5rem 0 1.5rem; }
    .back{
      display:inline-flex; align-items:center; gap:0.45rem;
      font-size:0.85rem; font-weight:600; letter-spacing:0.02em;
      color:rgba(214,223,231,.85); text-decoration:none;
      padding:0.45rem 0.85rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05);
      transition:border-color .15s, background .15s, color .15s;
    }
    .back:hover{ color:#fff; border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.1); }

    /* Download pill — same shape language as .back / .album-link. */
    .trip-export{
      display:inline-flex; align-items:center; gap:0.45rem;
      font:inherit; font-size:0.85rem; font-weight:600; letter-spacing:0.02em;
      color:rgba(214,223,231,.85); cursor:pointer;
      min-height:40px; padding:0.45rem 0.9rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05);
      transition:border-color .15s, background .15s, color .15s;
    }
    .trip-export:hover:not(:disabled){ color:#fff; border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.1); }
    .trip-export:active:not(:disabled){ transform:translateY(1px); }
    .trip-export:disabled{ opacity:.6; cursor:default; }
    .trip-export svg{ width:17px; height:17px; color:var(--gold); flex:none; }
    .trip-export[hidden]{ display:none; }
    @media (max-width:480px){ .trip-export span{ display:none; } .trip-export{ padding:0.45rem 0.7rem; } }

    /* "Save offline" switch — sits with .trip-export because it's the same kind
       of control: take this trip with you. Off by default; nothing is stored
       until it's on. Shape matches the pills either side of it; the slider
       itself is styled by .pa-switch in person-travel.css. */
    .trip-offline{
      min-height:40px; padding:.35rem .8rem; border-radius:999px;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.16);
      transition:border-color .15s, background .15s;
    }
    .trip-offline:hover{ border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.1); }
    /* Same [hidden]-vs-display trap as .album-link / .trip-export below. */
    .trip-offline[hidden]{ display:none; }

    /* Photo album pill — lives in the topbar alongside .back / .trip-export,
       so it matches their shape and size rather than the old hero pill's. */
    .album-link{
      display:inline-flex; align-items:center; gap:.45rem;
      font-size:.85rem; font-weight:600; letter-spacing:.02em;
      color:rgba(214,223,231,.85); text-decoration:none; white-space:nowrap;
      min-height:40px; padding:.45rem .85rem; border-radius:999px;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.16);
      transition:border-color .15s, background .15s, color .15s;
    }
    .album-link:hover{ color:#fff; border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.1); }
    /* display:inline-flex above outranks the [hidden] attribute's display:none,
       so hiding the pill needs this — same reason .trip-export has it. */
    .album-link[hidden]{ display:none; }
    .album-link svg{ width:17px; height:17px; color:var(--gold); flex:none; }
    /* No album set: same pill, muted and non-interactive. */
    .album-link--empty{ opacity:.55; cursor:default; }
    .album-link--empty:hover{ color:rgba(214,223,231,.85); border-color:rgba(255,255,255,.16); background:rgba(255,255,255,.05); }
    .album-link--empty svg{ color:rgba(214,223,231,.7); }

    /* ── Hero ────────────────────────────────────────────────── */
    .hero{ text-align:center; padding:1rem 0 1.75rem; }
    .hero .eyebrow{
      font-size:.72rem; letter-spacing:.32em; text-transform:uppercase;
      color:var(--gold); font-weight:700; margin-bottom:.9rem;
    }
    /* Last child of the hero now that the album pill moved up — the hero's own
       bottom padding does the spacing. */
    .hero h1{
      font-size:clamp(2.2rem,8vw,3.6rem); line-height:.95; margin:0;
      font-weight:800; letter-spacing:-0.03em; color:#fff;
    }

    /* ── Stops list ──────────────────────────────────────────── */
    /* margin-left:auto on the actions rather than space-between: the heading is
       hidden on an empty / not-found trip, and the buttons must stay right. */
    .stops-header{ display:flex; align-items:center; gap:.75rem; margin:0 0 1rem; min-height:32px; }
    .stops-header__actions{ margin-left:auto; display:inline-flex; align-items:center; gap:.4rem; }
    /* The pencil is 40px in the topbar; scaled down here to sit level with the
       order toggle instead of towering over the heading. */
    .stops-header .pa-admin-login{ width:32px; height:32px; }
    .stops-header .pa-admin-login svg{ width:16px; height:16px; }
    .stops-heading{
      font-size:.75rem; letter-spacing:.18em; text-transform:uppercase;
      color:rgba(214,223,231,.6); font-weight:700; margin:0;
    }
    .stops-order-toggle{
      flex:none; display:inline-flex; align-items:center; justify-content:center;
      padding:.3rem; border:0; border-radius:8px; background:transparent; cursor:pointer;
      color:rgba(214,223,231,.6); transition:color .15s, background .15s;
    }
    .stops-order-toggle:hover{ color:var(--gold); background:rgba(255,255,255,.08); }
    /* Same [hidden]-vs-display trap as .album-link / .trip-export — without this
       the toggle stays on screen in admin mode, where it has no business being. */
    .stops-order-toggle[hidden]{ display:none; }
    .stops-order-toggle svg{ display:block; transition:transform .2s; }
    .stops-order-toggle.is-reversed svg{ transform:rotate(180deg); }

    /* Refresh — same box as the order toggle, to the right of the pencil. It
       re-fetches WITHOUT clearing the list: whatever is on screen stays put for
       the whole request, and a failed refresh leaves it alone entirely. The
       spin is the only signal that anything is happening. */
    .stops-refresh{
      flex:none; display:inline-flex; align-items:center; justify-content:center;
      padding:.3rem; border:0; border-radius:8px; background:transparent; cursor:pointer;
      color:rgba(214,223,231,.6); transition:color .15s, background .15s;
    }
    .stops-refresh:hover:not(:disabled){ color:var(--gold); background:rgba(255,255,255,.08); }
    .stops-refresh svg{ display:block; }
    /* pa-spin is declared in person-travel.css, already loaded on this page. */
    .stops-refresh.is-spinning svg{ animation:pa-spin .8s linear infinite; }
    .stops-refresh.is-spinning{ color:var(--gold); }
    /* Refresh failed (usually offline). The list it was refreshing is untouched
       — this tint is the whole error report. */
    .stops-refresh.is-error{ color:#f3c9b6; }
    @media (prefers-reduced-motion:reduce){
      .stops-refresh.is-spinning svg{ animation:none; opacity:.55; }
    }
    .stops{ display:flex; flex-direction:column; gap:.9rem; list-style:none; margin:0; padding:0; }
    .stop-row{ display:flex; flex-direction:column; gap:.5rem; }

    .stop{
      display:flex; align-items:stretch; gap:0; border-radius:16px; overflow:hidden;
      text-align:left; font-family:inherit; cursor:pointer; width:100%;
      background:var(--paper); color:var(--ink);
      box-shadow:0 18px 40px -22px rgba(0,0,0,.8);
      border:1px solid var(--border, #B9B2A0);
      transition:transform .15s, box-shadow .2s;
    }
    .stop:hover{ transform:translateY(-3px); box-shadow:0 26px 50px -22px rgba(0,0,0,.85); }

    .stop__no{
      flex:none; width:74px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:2px;
      background:var(--enamel); color:var(--plaque);
    }
    .stop__no .n{ font-size:1.7rem; font-weight:800; line-height:1; font-family:'Arial Narrow',Impact,sans-serif; }
    .stop__no .lbl{ font-size:.55rem; letter-spacing:.22em; text-transform:uppercase; opacity:.8; }

    .stop__body{ flex:1; min-width:0; padding:1rem 1.15rem; display:flex; flex-direction:column; justify-content:center; gap:.25rem; }
    .stop__city{
      font-family:'Arial Narrow',Impact,sans-serif;
      font-weight:700; text-transform:uppercase; letter-spacing:.01em;
      font-size:1.5rem; line-height:1; color:var(--enamel);
    }
    .stop__meta{ font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--door); font-weight:600; }
    .stop__note{ font-size:.9rem; line-height:1.5; color:#4a4a44; margin:0; }

    .stop__go{
      flex:none; align-self:center; margin:0 1.1rem 0 .5rem;
      font-size:1.3rem; color:var(--terracotta); font-weight:700;
    }

    .empty{ text-align:center; padding:3rem 1rem; color:rgba(214,223,231,.6); }
    .empty--error{ color:#f3c9b6; }

    @media (max-width:560px){
      .stop__no{ width:58px; }
      .stop__city{ font-size:1.25rem; }
      .stop__note{ display:none; }
      /* Pinned chrome costs screen height permanently, so buy some back for
         the stop list on a phone. */
      .topbar{ padding-bottom:1rem; }
      .hero{ padding:.25rem 0 1.25rem; }
    }

    /* The topbar row is Back + album + Download + the offline switch, and it has
       to survive a 360px phone. Two stages, each dropping a label once its pill
       stops fitting — the icon (or the slider) still carries the state, and the
       title/aria-label carry the words for anyone who needs them.

       First the switch's label, which is the widest of the three. */
    @media (max-width:560px){
      .pa-switch__label{ display:none; }
      .trip-offline{ padding:.35rem .55rem; }
    }
    /* Then the album's. Measured: Back + "Photo album ↗" + icon-only Download +
       the icon-only switch need ~390px, so the album pill drops to its icon just
       above that — same move .trip-export makes at 480px. */
    @media (max-width:430px){
      .album-link span{ display:none; }
      .album-link{ padding:.45rem .7rem; }
    }

    /* Short viewport (landscape phone, split view). The hero is pinned now, so
       at this height it would leave the list a ~50px slot. Condense the whole
       header block instead. */
    @media (max-height:620px){
      .wrap{ padding-top:.75rem; }
      .topbar{ padding:0 0 .6rem; }
      .hero{ padding:0 0 .9rem; }
      .hero .eyebrow{ font-size:.65rem; margin-bottom:.35rem; }
      .hero h1{ font-size:clamp(1.5rem,5vw,2rem); }
      .back, .trip-export, .album-link, .trip-offline{ min-height:34px; padding:.3rem .7rem; }
      .stops-header{ margin-bottom:.6rem; }
    }
  </style>
  <link rel="stylesheet" href="person-travel.css" />
</head>
<body>
  <div class="wrap" id="trip-screen">
   <!-- Pinned: everything above the list stays put while the stops scroll. -->
   <div class="trip-top">
    <div class="topbar">
      <a class="back" href="/about">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <div class="header-actions">
        <!-- Unhidden by trip.js once the trip loads; shows a muted "No album"
             pill when the trip has none. -->
        <a class="album-link" id="trip-album" href="#" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span id="trip-album-label">Photo album ↗</span>
        </a>
        <!-- Public — everyone can take the trip away as a file. Unhidden by
             trip.js once the trip has stops. -->
        <button id="trip-export-btn" class="trip-export" type="button" hidden
                title="Download this trip as an HTML file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          <span id="trip-export-label">Download</span>
        </button>
        <!-- Keep this trip readable with no connection. Public, per trip, and
             OFF by default — nothing is written to the device until it's on.
             Unhidden by trip.js once the trip loads. A real checkbox does the
             work so it is keyboard- and screen-reader-native; .pa-switch draws
             the slider (person-travel.css). -->
        <label class="pa-switch trip-offline" id="trip-offline" hidden>
          <input type="checkbox" id="trip-offline-input" />
          <span class="pa-switch__track" aria-hidden="true"></span>
          <span class="pa-switch__label">Save offline</span>
        </label>
      </div>
    </div>

    <section class="hero">
      <p class="eyebrow" id="trip-eyebrow"></p>
      <h1 id="trip-headline">Loading…</h1>
    </section>

    <div id="travel-admin-bar" class="travel-admin-bar" hidden></div>

    <!-- The row itself is always present — the admin pencil lives here now, and
         it has to stay reachable on an empty or not-found trip. Only the
         heading and the order toggle come and go. -->
    <div class="stops-header" id="stops-header">
      <h2 class="stops-heading" id="stops-heading" hidden>Stops along the way</h2>
      <div class="stops-header__actions">
        <button class="stops-order-toggle" id="stops-order-toggle" type="button"
                aria-pressed="false" title="Reverse order" aria-label="Reverse stop order" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
        </button>
        <button id="admin-login-btn" class="pa-admin-login" type="button"
                title="Edit — admin login" aria-label="Edit — admin login">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </button>
        <button id="trip-refresh-btn" class="stops-refresh" type="button"
                title="Refresh" aria-label="Refresh this trip">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <path d="M21 3v6h-6"/>
          </svg>
        </button>
      </div>
    </div>
   </div>

   <!-- The scrolling half. -->
   <div class="stops-scroll">
    <ul class="stops" id="stops"></ul>
   </div>
  </div>

  <!-- The stop reader at /travel/:slug/:stop — a screen, not an overlay. The bar
       and the nav are flex:none, the frame is the only flexible row, and the page
       itself never scrolls (body{overflow:hidden} above), so the postcard's own
       document is the single scroller. Populated by stop-view.js.

       The iframe is sandboxed with allow-scripts and deliberately WITHOUT
       allow-same-origin: the postcard HTML is admin-authored and runs in an
       opaque origin where it cannot reach this page's DOM, cookies, or storage.
       Never add allow-same-origin here — together with allow-scripts it re-grants
       same-origin access and defeats the sandbox entirely. -->
  <section class="stop-screen" id="stop-screen" aria-label="Postcard" hidden>
    <div class="stop-screen__bar">
      <span class="stop-screen__title"></span>
      <button class="stop-screen__dl" type="button" aria-label="Download this postcard"
              title="Download this postcard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 12l5 5 5-5M4 20h16"/></svg>
      </button>
      <button class="stop-screen__close" type="button" aria-label="Close postcard" title="Close postcard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <!-- The stage is the flexible row and clips the slide; the frame inside is
         what stop-view.js swaps. Previous/Next animates by putting the incoming
         frame in here alongside the outgoing one — it is still always a brand
         new iframe, which is what keeps paging out of the session history. -->
    <div class="stop-screen__stage">
      <iframe class="stop-screen__frame" sandbox="allow-scripts" title="Postcard"></iframe>
    </div>
    <!-- The word lives in its own span so the landscape rails can drop it and
         keep the arrow; aria-label carries the name either way (and contains the
         visible word, so it still satisfies Label in Name). -->
    <div class="stop-screen__nav" hidden>
      <button class="stop-screen__nav-btn" type="button" data-dir="-1" aria-label="Previous stop"><span aria-hidden="true">&larr;</span><span class="stop-screen__nav-label">Previous</span></button>
      <span class="stop-screen__counter"></span>
      <button class="stop-screen__nav-btn" type="button" data-dir="1" aria-label="Next stop"><span class="stop-screen__nav-label">Next</span><span aria-hidden="true">&rarr;</span></button>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script src="html-span-editor.js"></script>
  <script src="stop-readonly.js"></script>
  <script src="stop-pair.js"></script>
  <script src="stop-view.js"></script>
  <script src="trip-export-style.js"></script>
  <script src="trip-export-css.js"></script>
  <script src="trip-export.js"></script>
  <script src="trip-admin.js"></script>
  <script src="trip-cache.js"></script>
  <script src="trip-stops.js"></script>
  <script src="trip-data.js"></script>
  <script src="trip.js"></script>
</body>
</html>
