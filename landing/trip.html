<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Served at /travel/:slug (Vercel rewrite → trip.html). base href keeps
       relative script/asset URLs resolving against the site root, not /travel/. -->
  <base href="/" />
  <title>Trip — David Rokhinson</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/vibelab-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    :root{
      --enamel:#123C6B;
      --door:#4E7FA6;
      --terracotta:#B0552E;
      --paper:#E7E3D6;
      --plaque:#FBFAF6;
      --ink:#1E2A33;
      --gold:#F2D46B;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family:'Inter',-apple-system,sans-serif;
      color:#D6DFE7;
      background:radial-gradient(120% 90% at 50% 0%, #2E5C86 0%, #16324B 55%, #0E2032 100%);
      background-attachment:fixed;
    }
    .wrap{ max-width:860px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }

    /* ── Top bar ─────────────────────────────────────────────── */
    .topbar{ display:flex; align-items:center; justify-content:space-between; padding:0.5rem 0 1.5rem; }
    .back{
      display:inline-flex; align-items:center; gap:0.45rem;
      font-size:0.85rem; font-weight:600; letter-spacing:0.02em;
      color:rgba(214,223,231,.85); text-decoration:none;
      padding:0.45rem 0.85rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05);
      transition:border-color .15s, background .15s, color .15s;
    }
    .back:hover{ color:#fff; border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.1); }
    .brandtag{ font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; color:rgba(214,223,231,.55); font-weight:700; }

    /* ── Hero ────────────────────────────────────────────────── */
    .hero{ text-align:center; padding:1rem 0 2.5rem; }
    .hero .eyebrow{
      font-size:.72rem; letter-spacing:.32em; text-transform:uppercase;
      color:var(--gold); font-weight:700; margin-bottom:.9rem;
    }
    .hero h1{
      font-size:clamp(2.2rem,8vw,3.6rem); line-height:.95; margin:0 0 1rem;
      font-weight:800; letter-spacing:-0.03em; color:#fff;
    }
    .album-link{
      display:inline-flex; align-items:center; gap:.5rem;
      font-size:.9rem; font-weight:600; letter-spacing:.02em;
      color:#EAF1F7; text-decoration:none;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
      padding:.5rem 1rem; border-radius:999px;
      transition:border-color .15s, background .15s;
    }
    .album-link:hover{ border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.12); }
    .album-link svg{ width:18px; height:18px; color:var(--gold); flex:none; }
    .hero p.lede{
      max-width:56ch; margin:1.25rem auto 0; font-size:1.02rem; line-height:1.65;
      color:rgba(214,223,231,.9);
    }

    /* ── Stops list ──────────────────────────────────────────── */
    .stops-heading{
      font-size:.75rem; letter-spacing:.18em; text-transform:uppercase;
      color:rgba(214,223,231,.6); font-weight:700; margin:0 0 1rem;
    }
    .stops{ display:flex; flex-direction:column; gap:.9rem; list-style:none; margin:0; padding:0; }
    .stop-row{ display:flex; flex-direction:column; gap:.5rem; }

    .stop{
      display:flex; align-items:stretch; gap:0; border-radius:16px; overflow:hidden;
      text-align:left; font-family:inherit; cursor:pointer; width:100%;
      background:var(--paper); color:var(--ink);
      box-shadow:0 18px 40px -22px rgba(0,0,0,.8);
      border:1px solid var(--border, #B9B2A0);
      transition:transform .15s, box-shadow .2s;
    }
    .stop:hover{ transform:translateY(-3px); box-shadow:0 26px 50px -22px rgba(0,0,0,.85); }

    .stop__no{
      flex:none; width:74px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:2px;
      background:var(--enamel); color:var(--plaque);
    }
    .stop__no .n{ font-size:1.7rem; font-weight:800; line-height:1; font-family:'Arial Narrow',Impact,sans-serif; }
    .stop__no .lbl{ font-size:.55rem; letter-spacing:.22em; text-transform:uppercase; opacity:.8; }

    .stop__body{ flex:1; min-width:0; padding:1rem 1.15rem; display:flex; flex-direction:column; justify-content:center; gap:.25rem; }
    .stop__city{
      font-family:'Arial Narrow',Impact,sans-serif;
      font-weight:700; text-transform:uppercase; letter-spacing:.01em;
      font-size:1.5rem; line-height:1; color:var(--enamel);
    }
    .stop__meta{ font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--door); font-weight:600; }
    .stop__note{ font-size:.9rem; line-height:1.5; color:#4a4a44; margin:0; }

    .stop__go{
      flex:none; align-self:center; margin:0 1.1rem 0 .5rem;
      font-size:1.3rem; color:var(--terracotta); font-weight:700;
    }

    .empty{ text-align:center; padding:3rem 1rem; color:rgba(214,223,231,.6); }
    .empty--error{ color:#f3c9b6; }

    footer{ text-align:center; margin-top:3rem; font-size:.8rem; color:rgba(214,223,231,.5); }

    @media (max-width:560px){
      .stop__no{ width:58px; }
      .stop__city{ font-size:1.25rem; }
      .stop__note{ display:none; }
    }
  </style>
  <link rel="stylesheet" href="person-travel.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="/about">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <span class="brandtag">A David Rokhinson trip</span>
    </div>

    <section class="hero">
      <p class="eyebrow" id="trip-eyebrow"></p>
      <h1 id="trip-headline">Loading…</h1>
      <a class="album-link" id="trip-album" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Photo album ↗</span>
      </a>
      <p class="lede" id="trip-lede"></p>
    </section>

    <div id="travel-admin-bar" class="travel-admin-bar" hidden></div>

    <h2 class="stops-heading" id="stops-heading" hidden>Postcards from the route</h2>
    <ul class="stops" id="stops"></ul>

    <footer>Part of David Rokhinson&rsquo;s corner of vibelab.</footer>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script src="stop-popup.js"></script>
  <script src="trip.js"></script>
</body>
</html>
